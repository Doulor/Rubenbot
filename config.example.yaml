# RubenBot 配置示例：复制为 config.yaml 后修改
# 字符串里可以用 ${ENV_VAR} 引用环境变量，例如 api_key: "${RUBENBOT_API_KEY}"

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${RUBENBOT_API_KEY}"
  chat_model: "deepseek-chat"
  # 抽取/归纳/审查缺省时跟随 chat_model
  extract_model: ""
  consolidate_model: ""
  gate_model: ""
  # 可扩展的角色 → 模型映射：预置 fast / summary / vision（未配回退 chat_model），
  # 也可写自定义角色名（gate / distill 等）；同一角色写了这里就优先于上面的旧字段。
  # 值可以是一个模型名，也可以是按优先级排的模型名列表（模型池）。
  models: {}
  #   fast: "deepseek-chat"        # 小任务（标题、轻判断等）
  #   summary: "deepseek-chat"     # 滚动摘要
  #   vision: "qwen-vl-plus"       # 看图
  #   chat: ["deepseek-chat", "deepseek-chat-backup"]  # 模型池：主模型挂了自动切备选
  # 模型池策略：failover（按顺序故障转移）/ round_robin（轮询）/ random（随机）
  # 单模型列表时三种策略行为一致；配了多个模型时按策略最多走一遍、不额外退避。
  model_strategy: "failover"
  # 每角色覆盖全局策略；没写的角色跟随 model_strategy
  model_strategies: {}
  #   chat: "round_robin"
  temperature: 0.8
  timeout: 60          # 单次请求超时（秒）
  max_retries: 2       # 失败重试次数：408/429/5xx 退避重试，间隔 1s / 3s（仅单模型时）

persona:
  path: "data/SOUL.md"
  examples_enabled: true                    # 注入「我说话的样子」，不改人格文件
  examples_path: "data/reply_examples.json" # 可编辑 JSON 数组，每项是短回复字符串或带 text 的对象
  examples_count: 5                         # 按文件顺序最多取几条（不足就全取，0 不注入）
  examples_position: "after"                # before 在人格正文前，after 在正文后

database_path: "data/rubenbot.db"

memory:
  extract_every_n: 30          # 同一会话攒够多少条未抽取消息就触发
  extract_silence_seconds: 300 # 或者会话静默这么久后触发
  extract_min_pending: 4       # 单人至少积累几条才抽取
  extract_window: 80           # 一次最多喂给模型的该人消息数
  inject_limit: 20             # 回复时最多注入多少条记忆
  dedupe_threshold: 0.8        # 与已有记忆的 token Jaccard 相似度阈值
  consolidate_new_threshold: 50
  consolidate_interval_hours: 24
  consolidate_max_memories: 150
  consolidate_remove_ratio: 0.2
  consolidate_remove_min: 4
  raw_keep_per_chat: 500
  # 记忆 v2：画像提炼与时间线
  distill_new_threshold: 20      # 新增事件+事实达到多少条触发画像提炼
  distill_interval_hours: 24     # 或距上次提炼超过这么久
  distill_max_events: 120        # 一次提炼最多喂多少条新事件
  distill_max_facts: 80          # 一次提炼最多喂多少条新事实
  status_expiry_min_days: 1      # 近况过期天数夹取下限
  status_expiry_max_days: 90     # 近况过期天数夹取上限
  timeline_compress_after_days: 7   # 7 天前的事件按周压成 digest
  timeline_prune_after_days: 90     # 90 天前只留高显著度事件
  timeline_prune_keep_salience: 0.7
  self_event_max_chars: 120      # 自我时间线里每条消息的截断长度
  # 记忆 v2 读取侧：渐进披露、跨会话、分寸审查
  index_active_days: 30          # 群成员索引只收近 N 天在本群活跃的人
  index_max_members: 40          # 索引最多多少人
  index_ttl_seconds: 600         # 索引缓存多久失效（画像更新时立即失效）
  index_identity_chars: 40       # 索引「一句话身份」截断长度
  mentioned_max_people: 3        # 一轮最多预拉几个被提及者的画像
  profile_inject_max_chars: 600  # 说话人核心画像注入的最大字符数
  inject_budget_tokens: 1200     # 本轮记忆注入预算；超了先砍事实、再砍时间线
  timeline_hit_limit: 6          # 每人最多带几条相关旧事
  cross_session_hours: 24        # 私聊跨会话摘要回看的小时数
  self_inject_hours: 24          # 自我注入回看本会话的小时数
  self_inject_limit: 3           # 自我注入最多几条
  gate_confidence_threshold: 0.6 # 分寸审查模型判定的置信度下限
  gate_ask_high_sensitivity: true # 高敏感跨场合项是否进待问队列
  recall_tool_enabled: true      # 模型支持工具调用时开放 recall 工具
  recall_tool_max_rounds: 2      # recall 工具循环最多几轮
  # 会话滚动摘要：把本会话的早期对话压成五段式摘要，prompt 里放「摘要 + 近期原文」
  rolling_summary:
    enabled: true                # 总开关；关闭后上下文组装与以前一致
    trigger_after: 60            # 未摘要的原文超过这么多条触发一次压缩
    keep_recent: 30              # 始终保留的最新原文条数，不参与压缩
    max_chars: 800               # 摘要总长上限（五段合计），更新时模型需在此取舍
  # 群定位：每群两份并存——WebUI 手写的群备注 + 后台按聊天内容归纳的群定位。
  # 注入时手写优先，手写为空才用自归纳，两份都空不注入；私聊不注入。
  # 归纳只在后台维护任务里发生，收消息/裁定/生成三步的模型调用次数不变。
  group_profile:
    enabled: true                # 自归纳总开关；关闭后手写备注仍照常注入
    update_interval_hours: 24    # 距上次归纳超过这么久，后台会重新归纳一次
    min_messages: 50             # 水位之后的新群消息达到多少条才值得再归纳
    max_chars: 300               # 群定位注入与归纳的总长上限，超长截断
    max_batch_messages: 200      # 单次最多喂给模型的原文条数，积压时分批

# 联网搜索：给模型一个 web_search 工具（仿 recall 的工具接法）
# 渠道按 order 依次尝试：没配 key 的自动跳过，抛错/超时/空结果就换下一个，
# 第一个有结果的胜出。整条链一个 key 都没有时工具不注册，模型看不见它；
# 日志会打一行「联网搜索未配置，已跳过」。
# 旧写法（provider + api_key 平铺）仍可加载，会自动映射成 order: [provider]；
# 已下线的旧渠道在配置里出现时会被忽略并打一行日志。
search:
  order: [tavily, deepseek]  # 尝试顺序；可选 tavily / deepseek，未知名字忽略并打日志
  tavily:
    api_key: "${RUBENBOT_TAVILY_KEY}"
  deepseek:
    # 与 DeepSeek 模型同一把 key；按成功请求计费 $0.75/千次（失败/空结果不计费）
    api_key: "${RUBENBOT_DEEPSEEK_KEY}"
  timeout_seconds: 10      # 单次搜索请求超时（秒），整条链共用
  cooldown_seconds: 30     # 每会话两次真实搜索之间的冷却，整条链只过一次闸；冷却内只返回提示

# 操作电脑默认关。白名单只按「平台:发送者账号」完整匹配，不按昵称、群号或私聊授权。
computer:
  enabled: false
  # 省略时只信任本地 Console 的默认账号（平台 console，发送者 console:me）。
  # 显式填 [] 表示无人能操作真机；不继承插件的 owner_ids。
  # 白名单用户能以 bot 的系统账号操作真机，只填写可信账号，不要填密钥或环境变量。
  # whitelist: ["console:console:me"]
  sandbox_quota_mb: 100        # 每位访客的沙盒容量（MiB），范围 1–10240
  command_timeout_seconds: 60  # 单次命令时限（秒），范围 1–600
  output_limit_bytes: 32768    # 输出字节数上限，范围 32–1048576

# MCP 客户端：可选安装 pip install -e '.[mcp]'；只配置可信服务器。
# 修改后重启 bot。env/headers 支持 ${ENV_VAR}，不要把密钥写进命令行。
mcp:
  connect_timeout: 10       # 每台服务器的连接与发现时限（秒）
  call_timeout: 30          # 单次工具调用时限（秒）
  max_result_bytes: 32768   # 包括截断标记在内的 UTF-8 字节数，最少 32
  stdio_allowed_commands: [python, python3, uv, uvx, npx, node]  # 按文件名匹配；覆盖默认值，[] 全禁 stdio
  servers: []               # 启用示例时，改为 servers: 并取消下列对应注释
    # - name: local-docs
    #   enabled: true
    #   transport: stdio
    #   command: python
    #   args: ["/absolute/path/to/docs_server.py", "--stdio"]
    #   env: {DOCS_TOKEN: "${DOCS_TOKEN}"}
    # - name: remote-docs
    #   enabled: true
    #   transport: http       # Streamable HTTP，不是旧式 SSE 端点
    #   url: https://docs.example.org/mcp
    #   headers: {Authorization: "Bearer ${DOCS_TOKEN}"}

# 语音双向：听懂语音条（STT）与用语音回复（TTS）。
# 转写没有任何可用后端时语音消息只记 [语音] 占位；语音回复默认关闭，失败一律降级发文字。
voice:
  # ---- 入站语音条转写 ----
  # 首选后端：siliconflow（SenseVoiceSmall）、openai_compatible（任意兼容 base_url）、
  # qq_native（QQ 官方转写，仅 SnowLuma 适配器可用）。首选失败/空文本时自动顺延
  # 到其余已配置的 HTTP 后端，全失败才留 [语音] 占位。
  stt_provider: "siliconflow"
  stt_api_key: "${RUBENBOT_STT_KEY}"
  stt_base_url: ""                  # 仅 openai_compatible 用，例如 https://host/v1；填了才启用
  stt_model: "FunAudioLLM/SenseVoiceSmall"
  stt_timeout_seconds: 30           # 单次转写请求超时（秒）
  stt_max_seconds: 60               # 单条语音时长上限（秒），超过不转写
  stt_max_bytes: 5242880            # 单条语音大小上限（字节，默认 5MB），超过不转写
  # ---- 出站语音回复 ----
  # off 从不发语音（默认）；reply_voice 对方发语音时用语音回；
  # on_request 在 reply_voice 基础上，被明确要求「用语音说」时也发
  tts_mode: "off"
  # custom：任意 OpenAI 兼容的 /audio/speech 接口（默认）；siliconflow：CosyVoice2。
  # custom 未配 tts_base_url 或 tts_model 视为未配置，照常发文字。
  tts_provider: "custom"
  tts_base_url: ""                  # custom 用，例如 https://host/v1；留空降级发文字
  tts_api_key: ""                   # custom 的 Bearer Key；硅基流动留空复用 stt_api_key
  tts_model: ""                     # custom 必填；硅基流动留空用 CosyVoice2-0.5B
  tts_voice: ""                     # custom 的音色名，随请求一起发给接口
  tts_siliconflow_voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
  tts_max_chars: 60                 # 正文超过这么多字不合成；被拆条的长回复一律发文字
  tts_timeout_seconds: 30

chat:
  bot_name: "Ruben"
  history_size: 30
  # 发送前移除括号里的动作描写（如「（笑）」）；默认关闭
  strip_action_parens: false
  history_ttl_hours: 12
  # 入站去重：同一平台消息 id 在该时间窗内重复到达则丢弃（秒；0 关闭）
  dedupe_ttl_seconds: 300

# 回复形态：一次回复拆成几段、段与段之间停多久（生成端按换行分成 1~3 段短句）
reply:
  # 一条回复最多发成几段；超出的并回最后一段，避免刷屏
  max_segments: 3
  # 段间打字延迟：第一段立即发，后续段按下一段字数等一会
  # 关掉后所有段落连发
  segment_delay_enabled: true
  # 每字毫秒数：下一段有多少个非空白字符就等多少毫秒
  segment_delay_per_char_ms: 60
  # 单次停顿的上下限（毫秒）：太短没停顿感，太长拖慢整条回复
  segment_delay_min_ms: 150
  segment_delay_max_ms: 1500

# 回复决策（意愿系统）：群里什么时候开口
decision:
  # 消息合并窗口：同一人连发的多条先攒着合并成一轮（秒）
  merge_window_seconds: 4
  # 硬触发（私聊/@/回复/叫名字）走短窗口；0 表示立即处理
  hard_merge_window_seconds: 1
  # 整批上限：从首条消息算起最多等这么久就放出；0 表示不设上限
  batch_max_seconds: 10
  # 批次里有人 @/回复 bot 时，截止时间提前到「首条 + 这么多秒」；0 表示不启用
  urgent_seconds: 2
  # 叫到这些名字/别名就算硬触发；留空则用 chat.bot_name
  aliases: []

  base: 0.10                  # 每个群的基础意愿（默认低，靠动量和相关性加分）
  threshold: 0.85             # 分数达到多少才开口
  threshold_noise: 0.10       # 阈值附近的随机扰动幅度
  threshold_noise_band: 0.20  # 离阈值多近才摇骰子

  # 对话动量：被 @/回复触发的发言才算真参与，之后一两分钟内加分、按半衰期衰减；
  # 主动开口不喂动量（防自激）。0.50 的量级目标是被点名后约两分钟内还够过阈值
  momentum_bonus: 0.50
  momentum_half_life_seconds: 120  # 动量的半衰期
  relevance_bonus: 0.60       # 话题相关性：记忆检索命中时的最大加分
  relevance_scale: 8.0        # 检索分数归一化尺度

  ratio_window: 30            # 统计发言占比时看最近多少条消息（含 bot）
  ratio_threshold: 0.20       # bot 占比超过这个值开始减分
  ratio_silence: 0.60         # 占比到这个值直接静默
  ratio_penalty: 1.50         # 占比超阈值时的最大减分

  cooldown_seconds: 30        # 发言后冷却时间（硬触发不受影响）
  cooldown_penalty: 0.60      # 冷却期内最多减多少分

  veto_marker: "[不回复]"     # 模型输出这个标记就静默丢弃

  # 每群覆盖：键是群的 chat_id
  groups: {}
  # groups:
  #   "123456":
  #     activity_multiplier: 1.5   # 活跃度倍率
  #     base: 0.15                 # 覆盖基础值（不写则用全局 base）
  #     quiet_hours: ["23:00-07:30"]  # 静默时段，可写多个

# 回复生成策略：决定要回之后，正文怎么写
generation:
  # 默认先掷长度档并生成表达决策书；闲聊碎片可省一次 fast 调用。
  # true 表示即使闲聊碎片也调用 fast；不是表达决策的总开关。
  two_stage:
    enabled: false
# 提醒工具（模型工具 set_reminder）：只回应用户明确说「提醒我」的请求
reminder:
  enabled: true                # 关闭后模型无法设置提醒，已设的提醒照常触发
  max_pending_per_chat: 5      # 每个会话最多同时挂几条待执行提醒
  max_delay_minutes: 43200     # 单条提醒最远提前多久（分钟，默认 30 天）
  max_text_chars: 200          # 提醒正文截断长度

# 冷场开口（主动触达）：默认关闭，宁可漏、不可扰
proactive:
  enabled: false               # 只在群聊里生效，私聊不主动开口
  idle_hours: 6                # 距上一条消息超过这么久才考虑
  quiet_hours: ["23:00-08:00"] # 这段时间内不开口，格式同 decision.groups
  daily_limit: 1               # 每个群每日最多主动开口几次
  cooldown_minutes: 60         # 一次评估没开口后，隔多久再评估
  # 主动开口场景的意愿评分：基础分给得低，阈值附近有随机扰动
  base: 0.08
  threshold: 0.15
  threshold_noise: 0.10
  threshold_noise_band: 0.12
  relevance_bonus: 0.10        # 群近期话题命中记忆时最多加多少分
  relevance_scale: 8.0         # 检索分数归一尺度

# 通用适配器网关 + 事件通道：默认全关。
# 开启后模型可以查适配器的接口目录（adapter_actions）并按需调用（adapter_call），
# 平台推送的 notice / request 事件也会进事件流（judge_events 打开时才做快判）。
gateway:
  enabled: false               # 总开关：关时模型看不见网关工具
  enabled_conversations: []    # 允许用网关的会话（platform:chat_id）；群聊要显式列出，私聊主人恒可
  judge_events: false          # 事件判断总开关（快判）；关时事件只落库
  allow_sensitive: false       # 踢人/禁言/撤回/申请处理等敏感动作，需显式打开
  quiet_hours: "23:00-08:00"   # 安静时段：非必判事件只记录，不当场动作
  daily_budget_per_conversation: 20   # 每会话每天主动类动作上限
  global_daily_cap: 200        # 全局每天动作上限（熔断）

# 情绪与好感度：状态全部由代码规则算，模型不参与打分；只做背景注入与阈值微调
emotion:
  enabled: true                 # 总开关：关掉后不记录、不注入、不调阈值
  affinity_baseline: 50         # 好感度基线（也是衰减回归的目标）
  chat_delta: 0.2               # 与 bot 对话一轮的加分
  chat_daily_cap: 2.0           # 每人每个自然日靠对话最多加多少
  praise_delta: 1.0             # 被夸/感谢（关键词规则，保守）
  insult_delta: -2.0            # 被骂/恶语（同一套保守规则）
  decay_weekly: 0.05            # 每周向基线回归的比例，惰性折算
  # 情绪：事件 → 状态（强度 0–1）
  praise_mood: "开心"
  praise_intensity: 0.6
  insult_mood: "委屈"
  insult_intensity: 0.6
  excitement_mood: "兴奋"
  excitement_intensity: 0.4
  excitement_window_seconds: 600     # 统计「群里热闹」的时间窗
  excitement_min_messages: 6         # 窗口内至少这么多条真实消息
  excitement_min_bot_messages: 2     # 且 bot 至少参与了这么多次
  boredom_mood: "无聊"
  boredom_intensity: 0.3
  boredom_after_seconds: 10800       # 三小时没人理 bot 才判无聊
  half_life_seconds: 3600            # 情绪强度减半所需时间
  min_intensity: 0.05                # 低于它视为平静
  # 意愿阈值微调（加到阈值上；负数更容易开口）
  threshold_adjust:
    开心: -0.05
    兴奋: -0.05
    无聊: -0.03
    委屈: 0.05
    低落: 0.05

plugins:
  dir: "plugins"
  # 插件默认全部关闭（显式启用制）：只有列在这里的插件才会加载，
  # 留空或不写 enabled 都表示一个插件都不启用。
  enabled: []
  # 例如只启用 hello 示例插件（也可以直接在 WebUI 设置页开关，保存后写回这里并热生效）：
  # enabled: ["hello"]
  command_prefix: "/"

stickers:
  # 核心表情包行为默认关闭；打开 enabled 后以下设置才生效。
  enabled: false
  collect: false
  # 默认只收真表情（mface / 贴纸 / 摘要为「[动画表情]」的图片）；普通照片、
  # 截图被误收时是噪声，打开这个开关才收（入库仍标记为 photo，永不参与选图）。
  collect_photos: false
  send_probability: 0.15  # 文字回复后补发的概率
  # 接梗或短附和时只发一张表情的概率；库空、冷却中、发送失败时照常回文字。
  nonverbal_probability: 0.30
  cooldown_seconds: 300  # 两种发表情方式共用的会话冷却
  # 表情库目录：图片本体放 files/，索引是 index.json（运行时数据，已在 .gitignore 里排除）。
  dir: "data/stickers"
  # 单张表情图片的收集上限（字节）；超过或文件头识别不出 jpg/png/gif/webp 就不收本体。
  max_file_bytes: 8388608
  # 描述向量检索（可选）：base_url 与 model 都填才启用；留空时直接交给 fast 角色
  # 从候选列表里选编号。描述由 llm.models.vision 配置的视觉模型生成，没配就不生成。
  embedding_base_url: ""
  embedding_model: ""
  embedding_api_key: ""
  embedding_threshold: 0.3  # 余弦相似度超过该值就直接用这张表情
  embedding_refresh_seconds: 21600  # 描述向量缓存的刷新间隔

market:
  # 插件市场索引地址：索引仓库 plugins.json 的 raw 地址。
  # 留空或拉取失败（5 秒超时）时回退到内置官方索引（随框架发布的 6 个官方插件）。
  # index_url: "https://raw.githubusercontent.com/Doulor/Rubenbot-plugins/main/plugins.json"
  index_url: ""

adapters:
  console: {}                 # 本地调试：stdin/stdout
  snowluma:                   # OneBot v11
    ws_url: "ws://127.0.0.1:3001"
    http_url: "http://127.0.0.1:3000"
    access_token: ""
    self_id: ""               # 可选：bot 的 QQ 号，留空则从事件里自动取
    # 平台特有能力开关（SnowLuma 扩展动作 / QQ 空间 Web 接口）。
    # 插件/核心按名调用，关掉即跳过；未写的项用代码里的默认值。
    capabilities:
      # 给消息贴表情（set_msg_emoji_like），默认开
      emoji_like: true
      # 语音回复（record 段）。只在 voice.tts_mode 打开时才用；默认开，
      # 关掉即语音回复一律改发文字
      voice: true
      # 入站语音条原生转写（fetch_ptt_text，走 QQ 官方转写服务）。只在
      # voice.stt_provider 选 qq_native 时才用；默认开，关掉即跳过原生转写、
      # 直接走其他 HTTP 转写后端
      transcribe: true
      # 发表情（send_sticker 能力，核心表情行为用）：优先 mface 原生段、
      # 没有原生引用就退图片段；默认开。关掉即不发表情，核心行为静默跳过。
      sticker: true
      # 发 QQ 空间说说（send_qzone_msg），默认关：对外发布内容，需显式打开
      qzone: false
      # ---- QQ 空间互动（经 get_cookies 拿登录态后直调空间 Web 接口）----
      # 读别人/自己的说说流（qzone.feeds）与自己说说下收到的评论
      # （qzone.my_comments）：只读，默认开。注意 feeds: false 会同时关掉这两项。
      feeds: true
      # ⚠️ 以下三项是对外写操作，默认全关。开启风险提示：
      #   - QQ 空间接口未公开，高频点赞/评论极易触发风控（返回 -10049 /
      #     needVerify，严重时账号被限制空间功能）；
      #   - 自动化互动属于非人工行为，请自行确认不违反腾讯的服务条款；
      #   - 建议只在小范围、低频场景使用，并在插件层加冷却与频率上限。
      like: false       # 给说说点赞（qzone.like）
      comment: false    # 给说说发表评论（qzone.comment）
      reply: false      # 回复自己说说下的评论（qzone.reply）

  # Telegram（Bot API 长轮询，不需要公网回调地址）
  # telegram:
  #   # 找 @BotFather 创建 bot 拿 token；建议放环境变量，不要提交到仓库
  #   bot_token: "${RUBENBOT_TELEGRAM_TOKEN}"
  #   # getUpdates 长轮询挂起时长（秒），同时决定单次请求超时
  #   poll_timeout: 30
  #   # 只处理这些 chat_id 的消息（用户 id 或群 id，可写负数）；留空表示不限。
  #   # 群 id 形如 -1001234567890，配置后其他会话的消息直接忽略。
  #   allowed_chat_ids: []
  #   # getUpdates 的 offset 落盘位置：重启后不重复处理旧消息；留空则不落盘
  #   offset_file: "data/telegram_offset.json"
  #   # 平台特有能力开关：语音回复（sendVoice / sendAudio）与发表情
  #   # （sendSticker）。语音只在 voice.tts_mode 打开时才用，写成 false 则
  #   # 一律改发文字；表情写 false 则核心表情行为静默跳过
  #   capabilities:
  #     voice: true
  #     sticker: true
  # QQ 官方机器人（q.qq.com 开放平台，与上面的 OneBot 通道完全独立）
  # 凭证在开放平台「开发设置」里拿；client_secret 支持 ${ENV_VAR} 展开
  # qq_official:
  #   app_id: "${QQBOT_APP_ID}"
  #   client_secret: "${QQBOT_CLIENT_SECRET}"
  #   sandbox: false            # true 走沙箱域名 sandbox.api.sgroup.qq.com
  #   download_images: true     # 入站图片附件下载后转 base64 放进 image 段
  #   capabilities:
  #     sticker: true           # 发表情（QQ 官方没有原生表情接口，按图片兜底）

background_check_minutes: 5
log_level: "INFO"
