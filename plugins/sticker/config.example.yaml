# sticker 插件配置（删掉本文件即使用 plugin.py 里的默认值）
#
# 插件默认不启用：要进 config.yaml 的 plugins.enabled 才会加载（或在 WebUI
# 插件市场里点「启用」）。启用后，下面的配置才生效。

# 收集群聊里出现的表情 / 图片并入库。
# 默认关：表情是别人发的东西，只在明确想攒表情库时才打开。
# 收集按内容哈希去重，同一张图重复出现不会重复入库。
collect: false

# bot 完成一轮回复后，补一张表情的概率（0–1）。
# 默认 0.15，偏保守：宁可少发，不刷屏。
send_probability: 0.15

# 同一会话（平台 + chat_id）两次发表情的最小间隔，单位秒。
# 默认 300（5 分钟）。
cooldown_seconds: 300
