# qzone_post 插件配置（可选；不写就用下面的默认值）
#
# 触发方式（可组合）：
#   一、聊天里发 /说说 [内容]（命令名由 command 决定）
#       - 带内容：直接发这条
#       - 不带内容：按当前人格让 LLM 生成一条短说说再发
#   二、间隔定时：interval_hours > 0 时后台按间隔自动生成并发布
#   三、时间点定时：schedule_mode: times 或 both，配合 times / jitter_minutes
#   四、概率触发：prob: true，bot 回完一轮消息 / 后台 tick 时按 post_chance 掷骰
#   五、LLM 判断：llm_decide: true，后台每 check_interval_minutes 问模型
#       「现在有没有值得发的事」，返回 {"post": bool, "content": str}
#
# 自动模式（二/三/四/五）都受「节制三件套」约束：cooldown_minutes、
# daily_cap、quiet_hours。命令是明确指令，不受限也不走草稿确认。
#
# 发布只走核心能力 qzone.publish（SnowLuma 的 send_qzone_msg）。要真正发出去，
# 还得在 config.yaml 里打开 adapters.snowluma.capabilities.qzone: true；
# 没开时插件会回复明确原因。

# ---- 间隔定时 ----
# 定时发布间隔（小时）；0 = 关闭间隔定时
interval_hours: 0

# ---- 时间点定时 ----
# interval | times | both
#   interval：只用 interval_hours
#   times   ：只用下面的 times 时间点
#   both    ：两者并存
schedule_mode: interval
# 每天固定时间点，如 ["08:30", "21:00"]
times: []
# 每个时间点的随机抖动（±分钟）
jitter_minutes: 10

# ---- 概率 / LLM 触发 ----
# 后台检查 tick 的间隔（分钟）
check_interval_minutes: 60
# 概率触发：bot 完成一轮回复后（以及后台 tick）按 post_chance 掷骰
prob: false
post_chance: 0.3
# LLM 判断：让模型自己判断现在有没有值得发的事
llm_decide: false
# 模型说发之后，是否还要再过一次 post_chance 概率门
llm_then_prob: true

# ---- 节制三件套（所有自动模式强制生效）----
# 两次自动发布的最小间隔（分钟）
cooldown_minutes: 480
# 每天自动发布上限；0 = 不限
daily_cap: 2
# 安静时段；形如 "23:00-07:00"，空串关闭
quiet_hours: "23:00-07:00"

# ---- 草稿确认 ----
# 自动模式生成的内容先私聊发给主人，主人回「发」才发布；
# 回其他内容或超时作废。命令触发不走草稿。
draft_confirm: true
draft_timeout_minutes: 30

# ---- 命令与主人 ----
# 命令名（不带前缀），默认「说说」
command: "说说"
# 只有 owner_ids 里的人能用命令；默认关
owner_only: false
# 主人 QQ（或平台的 sender_id）；命令权限与草稿确认都用它
owner_ids: []
# 例如：
# owner_ids: ["10001"]

# ---- 空间互动（后台巡检；写操作默认全关）----
# 只巡检 interact_uins 里的 QQ，按 tid / 评论 id 去重，每轮与每日都有上限；
# 安静时段沿用上面的 quiet_hours，期间不做任何互动动作。所有动作只走核心能力
# 入口：qzone.feeds / qzone.like / qzone.comment / qzone.my_comments / qzone.reply。
# 对应适配器开关（默认 feeds 开、like/comment/reply 关）：
#   adapters.snowluma.capabilities.{feeds,like,comment,reply}
#
# 注意：QQ 空间接口未公开，自动点赞/评论属于对外写操作，频率过高有风控风险；
# 建议只开给小范围、低频的白名单。
interact_interval_minutes: 60
# 白名单 QQ；留空表示不做互动巡检（只读巡检也不跑）
interact_uins: []
# 只看最近几天的说说/评论，窗口外的老说说整体跳过
interact_days: 3
# 每个 QQ 一次拉多少条说说；自己说说下的评论一次拉多少条
interact_feed_num: 10
interact_comment_num: 10
# 能力失败后的退避时长（分钟）；期间整个巡检跳过
interact_backoff_minutes: 30

# 自动点赞（默认关）
like_enabled: false
like_chance: 0.8
like_cap_per_round: 2
like_daily_cap: 20
# AI 评论（默认关）：按人格生成一句口语短评，不提「我是机器人」
comment_enabled: false
comment_chance: 0.3
comment_cap_per_round: 1
comment_daily_cap: 5
comment_max_chars: 30
# 回复自己说说下的评论（默认关）：只回别人的评论，每条说说最多回 reply_cap_per_post 条
reply_enabled: false
reply_cap_per_post: 3
reply_cap_per_round: 3
reply_daily_cap: 10
reply_max_chars: 30

# ---- 内容 ----
# 生成的说说最长字数（越短越像真人随手写的）
max_chars: 60
# 定时写什么：优先取最近 topic_window_hours 小时内的群聊，其次最近记忆，
# 都没有就写日常向
topic_window_hours: 6
topic_limit: 20
