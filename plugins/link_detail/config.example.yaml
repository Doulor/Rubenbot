# 由 WebUI 插件详情页保存为 config.yaml；启用和授权另在插件页设置。
cooldown_seconds: 120  # 同群同链接冷却（秒）
max_links: 3  # 单条消息的链接上限
send_video: false  # 发送视频文件（预留）
enable_bilibili: true  # B站
enable_douyin: true  # 抖音
enable_xiaohongshu: true  # 小红书
enable_xiaoheihe: true  # 小黑盒
enable_acfun: true  # A站
enable_instagram: true  # Instagram
enable_iwara: true  # iwara
enable_kuaishou: true  # 快手
enable_netease_music: true  # 网易云音乐
enable_nga: true  # NGA
enable_shipinhao: true  # 微信视频号
enable_tiktok: true  # TikTok
enable_x: true  # X
enable_weibo: true  # 微博
enable_youtube: true  # YouTube
enable_zhihu: true  # 知乎
enable_pixiv: true  # Pixiv
