# group_insights 插件配置（删掉本文件即使用 plugin.py 里的默认值）
#
# 两个功能都只读消息流水，不建表、不改核心存储：
#   一、发言统计：群里 @bot / 叫 bot 名字问「水群榜 / 发言统计 / 今天谁话最多」，
#       当场聚合 Top5（昵称 + 条数 + 占比）+ 一行点评
#   二、群聊总结：命中「总结一下 / 今天都聊了啥 / 补课」等触发词时，取今日消息
#       （最多 summary_max_messages 条）交给 summary 角色模型，按话题列点 + 关键原话
#
# 只做群聊，私聊一律不响应；图片/表情按 [图片] / [表情] 占位计入条数。
# 同群总结冷却默认 10 分钟，冷却内回上次结果；结果缓存在 data/summary_cache.json，
# 重启后当日缓存仍可复用（冷却也按缓存时间恢复）。

# 发言统计的默认窗口（天，1~30）；问法里出现「近 7 天 / 这周」按 7 天算，
# 出现「今天 / 今日」按 1 天算，区分不出来时用这里的默认值
stats_window_days: 1

# 发言统计触发词（整组替换；写成空列表 [] 表示关闭统计功能）
stats_triggers:
  - "水群榜"
  - "水群排行"
  - "发言统计"
  - "发言榜"
  - "发言排行"
  - "活跃榜"
  - "活跃排行"
  - "谁话最多"
  - "谁发言最多"
  - "谁最话痨"
  - "话最多"

# 群聊总结触发词（整组替换；写成空列表 [] 表示关闭总结功能）
# 统计与总结同时命中时按统计处理
summary_triggers:
  - "总结一下"
  - "总结下"
  - "群总结"
  - "今天都聊了啥"
  - "今天聊了啥"
  - "都聊了啥"
  - "聊了啥"
  - "补课"

# 单次总结最多取多少条消息；与今日全部消息取较少者
# （默认 200，调大只会多花 token，不会突破今日范围）
summary_max_messages: 200

# 同群总结冷却（分钟）；0 表示不冷却
summary_cooldown_minutes: 10

# 是否要求 @bot / 回复 bot / 叫 bot 名字才触发，
# 默认 true 避免群友之间随口一句「总结一下」就被 bot 接话
require_addressing: true
