# music 插件配置（删掉本文件即使用 plugin.py 里的默认值）

# 点歌触发词：消息以其中之一开头即触发（如「点歌 晴天」「我想听 晴天」）
triggers: ["点歌", "我想听"]

# 单人冷却（秒）：同一个人两次点歌之间的最小间隔
cooldown_seconds: 60

# 音源：目前只支持 netease（打开 music_card 时用于 OneBot 音乐段的 type=netease）
source: netease

# 音乐卡片：默认 false，发「歌名 — 歌手 + 链接」文字并附封面图，人人可见。
# 打开后仅在 SnowLuma 上先尝试 OneBot 音乐段；新版 QQ 客户端不渲染这种卡，
# 只显示「发送者版本过低，无法展示内容」，所以除非确认接收端能看，别开。
music_card: false
