# music 插件配置（删掉本文件即使用 plugin.py 里的默认值）

# 选歌列表最多列几首（1-20）；select_mode 为 single 时固定只取 1 首。
# 注意：结果会先探活过滤——网易云 VIP / 无版权曲目拿不到音频，不会进列表。
song_limit: 5

# 选择模式：text（发编号列表选歌，回复序号或「取消」）或 single（直接发第一首）
select_mode: text

# 选歌列表有效时间（秒），超时后撤回列表并提示已超时
timeout: 30

# 发送模式优先级列表（有序尝试，前一个失败/不适用才试下一个）：
#   record：语音条，audio URL 交给协议端下载转码（实测新版 QQ 能直接播放整首）
#   file  ：下载后以文件形式发送（语音转码失败时的备份档）
#   text  ：歌名 + 歌手 + 时长 + 链接（永远兜底）
#   card  ：OneBot 音乐卡。实测新版 QQ 只显示「发送者版本过低，无法展示内容」，
#           协议端却回执 200，所以默认不放进链里；确认接收端能渲染再加进去
send_modes: ["record", "file", "text"]

# 发歌后附一句网易云热评
enable_comments: true

# 发歌后附歌词图（需要 Pillow 与系统 CJK 字体；缺了自动跳过）
enable_lyrics: false

# 选歌列表超时后撤回（撤回走适配器 delete_msg，需要机主授予「平台能力」权限）
timeout_recall: true

# 单人冷却（秒）：同一个人两次点歌之间的最小间隔
cooldown_seconds: 60

# 不带平台名的「点歌」默认用哪个音源：网易点歌 / QQ点歌 / 酷狗点歌 等
default_player: 网易点歌
