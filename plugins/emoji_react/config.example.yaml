# emoji_react 插件配置（删掉本文件即使用 plugin.py 里的默认值）
#
# 表情 ID 遵循公开的 OneBot/CQ `face` 表（经典 0-104 段），常用含义：
#   0 惊讶   5 流泪   13 呲牙   14 微笑   15 难过   20 偷笑   21 可爱
#  26 惊恐  27 流汗  32 疑问  40 擦汗  42 鼓掌  52 亲亲  54 可怜
#  63 玫瑰  65 示爱  66 爱心  78 拥抱  79 强    89 OK
# 105 之后的新表情编号在不同客户端/协议端可能不一致，确认不了含义就别填；
# 某一池留空（[]）表示这条路径不贴。

enabled: true

# 同一会话（平台 + chat_id）贴表情的冷却，单位秒
cooldown_seconds: 120

# bot 回复后，给刚被回复的那条用户消息贴表情
after_reply:
  probability: 0.25
  emojis: [13, 14, 20, 21, 79]   # 呲牙 / 微笑 / 偷笑 / 可爱 / 强

# 消息命中关键词时，给这条消息贴该组表情
keywords:
  probability: 0.6
  groups:
    - keywords: ["哈哈", "笑死", "嘿嘿", "233", "hhh", "lol", "笑不活了"]
      emojis: [13, 20, 21]       # 呲牙 / 偷笑 / 可爱
    - keywords: ["爱你", "喜欢你", "么么", "亲亲", "抱抱", "可爱"]
      emojis: [66, 65, 78, 52]   # 爱心 / 示爱 / 拥抱 / 亲亲
    - keywords: ["厉害", "牛啊", "666", "好强", "膜拜", "大佬", "绝了"]
      emojis: [79, 42, 89]       # 强 / 鼓掌 / OK
    - keywords: ["卧槽", "居然", "真的假的", "天哪", "震惊", "啊这"]
      emojis: [0, 26, 32]        # 惊讶 / 惊恐 / 疑问
    - keywords: ["无语", "服了", "离谱", "流汗", "汗"]
      emojis: [27, 40]           # 流汗 / 擦汗
    - keywords: ["难过", "想哭", "emo", "累了", "郁闷", "焦虑"]
      emojis: [78, 5, 15, 54]    # 拥抱 / 流泪 / 难过 / 可怜
