[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubenbot"
version = "0.1.0"
description = "以记忆为核心的拟人社交聊天 bot 框架"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RubenBot contributors" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["pytest>=8", "rubenbot[mcp,webui]"]
webui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rubenbot = "rubenbot.__main__:main"

[tool.setuptools.packages.find]
include = ["rubenbot*"]

# 网关接口目录是数据文件（JSON），打包时要跟着走
[tool.setuptools.package-data]
"rubenbot.gateway" = ["catalogs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
