[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubenbot"
version = "0.1.0"
description = "以记忆为核心的拟人社交聊天 bot 框架"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RubenBot contributors" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "PyYAML>=6",
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "rubenbot[webui]"]
webui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rubenbot = "rubenbot.__main__:main"

[tool.setuptools.packages.find]
include = ["rubenbot*"]

# 网关接口目录是数据文件（JSON），打包时要跟着走
[tool.setuptools.package-data]
"rubenbot.gateway" = ["catalogs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 起步只开 pycodestyle（E）与 pyflakes（F），不引入风格流派之争
select = ["E", "F"]
# 长行不作为 lint 报错：中文注释和长字符串无法可靠折行，强行拆分只会更难读；
# 需要排版时再单独引入格式化器，避免一次性大范围重排代码。
ignore = ["E501"]
